<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Мій профіль — TurboTeam</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0a0c10;
    --card: #161a22;
    --card-2: #1d2330;
    --text: #ffffff;
    --muted: #8b93a3;
    --accent: #ff5a1f;
    --accent-2: #4cc9f0;
    --gold: #ffc828;
    --green: #3ddc84;
    --border: rgba(255, 255, 255, 0.07);
    --radius: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { padding-bottom: 84px; }

  .screen { display: none; padding: 16px 16px 8px; max-width: 480px; margin: 0 auto; }
  .screen.active { display: block; animation: fadeIn .2s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- ANIMATIONS ---------- */
  @keyframes flyIn { from { opacity:0; transform: translateY(-16px) scale(.3); } to { opacity:1; transform: none; } }
  @keyframes popIn { from { opacity:0; transform: scale(.55) translateY(10px); } to { opacity:1; transform: none; } }
  @keyframes slideIn { from { opacity:0; transform: translateX(-18px); } to { opacity:1; transform: none; } }
  @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes pulseGlow { 0%,100% { box-shadow: 0 0 0 0 rgba(255,90,31,0); } 50% { box-shadow: 0 0 18px 2px rgba(255,90,31,0.35); } }
  @keyframes screenInRight { from { opacity:0; transform: translateX(26px); } to { opacity:1; transform: none; } }
  @keyframes screenInLeft { from { opacity:0; transform: translateX(-26px); } to { opacity:1; transform: none; } }
  @keyframes celebratePop { 0% { opacity:0; transform: scale(.4) rotate(-8deg); } 60% { opacity:1; transform: scale(1.12) rotate(4deg); } 100% { opacity:1; transform: scale(1) rotate(0); } }
  @keyframes confettiFall { from { transform: translateY(-10px) rotate(0deg); opacity:1; } to { transform: translateY(420px) rotate(360deg); opacity:0; } }
  @keyframes countPulse { 0% { transform: scale(1); } 40% { transform: scale(1.18); color: var(--accent); } 100% { transform: scale(1); } }
  @keyframes confettiFallFull { from { transform: translateY(-20px) rotate(0deg); opacity:1; } to { transform: translateY(110vh) rotate(540deg); opacity:0; } }
  @keyframes championPop { 0% { opacity:0; transform: scale(.5) translateY(20px); } 60% { opacity:1; transform: scale(1.08) translateY(-4px); } 100% { opacity:1; transform: scale(1) translateY(0); } }

  /* ---------- TODAY ---------- */
  .greet { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .greet-text { font-size: 15px; color: var(--muted); }
  .greet-name { font-size: 18px; font-weight: 800; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; animation: floatY 3.2s ease-in-out infinite;
  }

  .hero {
    background: radial-gradient(circle at 50% 0%, rgba(255,90,31,0.20), transparent 70%);
    border-radius: 26px;
    padding: 18px 16px 18px;
    text-align: center;
  }
  .ring-wrap { position: relative; width: 192px; height: 192px; margin: 4px auto 2px; }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--card-2); stroke-width: 13; }
  .ring-fill {
    fill: none; stroke: url(#ringGrad); stroke-width: 13; stroke-linecap: round;
    stroke-dasharray: 503; stroke-dashoffset: 503;
    transition: stroke-dashoffset 1.2s cubic-bezier(.34,1.2,.4,1);
    filter: drop-shadow(0 0 6px rgba(255,120,40,0.5));
  }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-mascot { font-size: 32px; margin-bottom: 2px; animation: floatY 2.6s ease-in-out infinite; }
  .ring-streak { font-size: 40px; font-weight: 900; line-height: 1; letter-spacing: -1px; }
  .ring-streak small { font-size: 18px; font-weight: 800; color: var(--muted); }
  .ring-streak-label { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .05em; }

  .hero-msg { font-size: 15px; font-weight: 800; margin-top: 12px; }
  .hero-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

  .quick-row { display: flex; gap: 8px; margin-top: 16px; }
  .quick-pill {
    flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 10px 9px; text-align: left;
  }
  .quick-pill .q-label { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .quick-pill .q-value { font-size: 17px; font-weight: 800; margin-top: 3px; }
  .quick-pill .q-value.q-value-sm { font-size: 13px; line-height: 1.25; }
  .quick-pill .q-sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }

  .cta-row { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    flex: 1; border: none; border-radius: 14px; padding: 13px 10px;
    font-size: 13.5px; font-weight: 800; cursor: pointer;
    transition: transform .12s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #ff8a3d); color: #1a0a02; }
  .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }

  .section-title {
    font-size: 12.5px; font-weight: 800; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; margin: 22px 0 10px;
  }
  .feed-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px 14px; display: flex; align-items: center; gap: 11px; margin-bottom: 8px;
  }
  .feed-icon { font-size: 18px; width: 24px; text-align: center; }
  .feed-title { font-size: 13px; font-weight: 700; }
  .feed-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

  /* ---------- CALENDAR ---------- */
  .cal-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 14px; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav button { background: var(--card-2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 5px 11px; font-size: 14px; cursor: pointer; }
  .cal-month-label { font-weight: 800; font-size: 14px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-weekday { text-align: center; color: var(--muted); font-size: 10px; padding-bottom: 4px; }
  .cal-day { position: relative; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 9px; background: var(--card-2); border: 1px solid var(--border); font-size: 10px; color: var(--muted); gap: 1px; }
  .cal-day.empty { background: transparent; border-color: transparent; }
  .cal-day .num { font-size: 10px; }
  .cal-day .icon { font-size: 12px; line-height: 1; letter-spacing: -1px; white-space: nowrap; }
  .cal-day.gym { background: rgba(255,90,31,.18); border-color: rgba(255,90,31,.4); color: var(--text); }
  .cal-day.street { background: rgba(76,201,240,.18); border-color: rgba(76,201,240,.4); color: var(--text); }
  .cal-day.rest { background: rgba(76,201,120,.18); border-color: rgba(76,201,120,.4); color: var(--text); }
  .cal-day.skip { background: rgba(220,60,60,.18); border-color: rgba(220,60,60,.4); color: var(--text); }
  .cal-day.challenge { background: rgba(255,200,40,.18); border-color: rgba(255,200,40,.4); color: var(--text); }
  .cal-day.multi { background: linear-gradient(135deg, rgba(255,200,40,.22), rgba(255,90,31,.22)); border-color: rgba(255,200,40,.6); color: var(--text); }
  .cal-day.today { border: 2px solid #fff; box-shadow: 0 0 7px 1px rgba(255,255,255,.65); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; font-size: 11px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 3px; }

  /* ---------- ACHIEVEMENTS ---------- */
  .ach-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .ach-count { font-size: 12px; color: var(--muted); }
  .progress-bar-wrap { background: var(--card-2); border-radius: 999px; height: 9px; overflow: hidden; margin: 8px 0 18px; }
  .progress-bar-fill { background: linear-gradient(90deg, var(--accent), var(--gold)); height: 100%; width: 0%; border-radius: 999px; transition: width 1s cubic-bezier(.4,0,.2,1); }
  .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .badge-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; cursor: pointer; transition: transform .12s ease; }
  .badge-card:active { transform: scale(0.92); }
  .badge-card.unlocked { border-color: rgba(255,90,31,.45); background: rgba(255,90,31,.10); }
  .badge-card.unlocked .badge-icon { animation: floatY 3s ease-in-out infinite; }
  .badge-card.locked { opacity: .5; }
  .badge-icon { font-size: 23px; }
  .badge-title { font-size: 10.5px; font-weight: 700; line-height: 1.1; }
  .badge-sub { font-size: 9px; color: var(--muted); }
  .badge-card.unlocked .badge-sub { color: var(--accent); font-weight: 700; }

  /* ---------- RATING ---------- */
  .rank-row { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 11px 12px; margin-bottom: 8px; }
  .rank-row.me { border-color: rgba(255,90,31,.55); background: rgba(255,90,31,.12); animation: pulseGlow 2.4s ease-in-out infinite; }
  .rank-num { font-size: 13px; font-weight: 800; width: 26px; color: var(--muted); }
  .rank-row.me .rank-num { color: var(--accent); }
  .rank-avatar { font-size: 18px; width: 22px; text-align: center; }
  .rank-name { flex: 1; font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-hp { font-size: 12.5px; font-weight: 800; color: var(--gold); white-space: nowrap; }
  .rank-divider { text-align: center; color: var(--muted); font-size: 16px; letter-spacing: 3px; margin: 2px 0 8px; }

  /* ---------- TAB BAR ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
    display: flex; border-top: 1px solid var(--border);
    background: rgba(10,12,16,0.92); backdrop-filter: blur(10px);
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .tab {
    flex: 1; background: none; border: none; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10.5px; font-weight: 700; padding: 6px 0; cursor: pointer;
    transition: color .15s ease, transform .12s ease;
  }
  .tab .tab-icon { font-size: 19px; transition: transform .2s ease; }
  .tab:active { transform: scale(0.9); }
  .tab.active { color: var(--text); }
  .tab.active .tab-icon { transform: translateY(-2px) scale(1.12); }
  .tab:active { transform: scale(0.9); }

  /* ---------- SHARE MODAL ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 200;
  }
  .modal-backdrop.show { opacity: 1; pointer-events: auto; }
  .modal-sheet {
    position: relative;
    width: 100%; max-width: 480px; background: var(--bg); border-radius: 22px 22px 0 0;
    padding: 18px 18px 26px; transform: translateY(100%);
    transition: transform .28s cubic-bezier(.34,1.2,.4,1); border-top: 1px solid var(--border);
  }
  .modal-backdrop.show .modal-sheet { transform: translateY(0); }
  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 99px; margin: 0 auto 16px; }
  .modal-close-x {
    position: absolute; top: 14px; right: 14px; width: 30px; height: 30px;
    border-radius: 50%; border: none; background: var(--card-2); color: var(--text);
    font-size: 14px; font-weight: 800; cursor: pointer; z-index: 1;
  }
  .share-card-img {
    width: 100%; border-radius: 18px; display: block;
    border: 1px solid rgba(255,200,40,0.4); margin-bottom: 10px;
  }
  .modal-hint-save { text-align: center; font-size: 11px; color: var(--muted); margin-bottom: 4px; }

  .celebrate-sheet {
    position: relative; width: 100%; max-width: 480px; background: var(--bg);
    border-radius: 22px 22px 0 0; padding: 30px 18px 30px; transform: translateY(100%);
    transition: transform .3s cubic-bezier(.34,1.2,.4,1); border-top: 1px solid var(--border);
    text-align: center; overflow: hidden;
  }
  .modal-backdrop.show .celebrate-sheet { transform: translateY(0); }
  .confetti-container { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti-piece { position: absolute; top: -12px; width: 8px; height: 14px; border-radius: 2px; animation: confettiFall 1.7s ease-in forwards; }
  .celebrate-label { font-size: 12px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
  .celebrate-icon { font-size: 64px; margin: 10px 0 6px; display: inline-block; animation: celebratePop .6s cubic-bezier(.34,1.56,.64,1) both; }
  .celebrate-title { font-size: 19px; font-weight: 800; margin: 4px 0 20px; position: relative; }

  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--card-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 16px; font-size: 12.5px; font-weight: 600; max-width: 86%; text-align: center;
    opacity: 0; transition: opacity .2s ease, transform .2s ease;
    pointer-events: none; z-index: 220;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .state-msg { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 14px; }

  /* ---------- SKELETON LOADER ---------- */
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  @keyframes loaderBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes loaderTextFade { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .skel { background: linear-gradient(90deg, var(--card) 20%, rgba(255,255,255,0.09) 50%, var(--card) 80%); background-size: 200% 100%; animation: shimmer 1.1s ease-in-out infinite; border-radius: 14px; }
  .skel-screen { padding: 16px; max-width: 480px; margin: 0 auto; }
  .skel-loader { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 30px 0 26px; }
  .skel-loader-icon { font-size: 36px; animation: loaderBounce 1s ease-in-out infinite; }
  .skel-loader-text { font-size: 13px; font-weight: 700; color: var(--muted); animation: loaderTextFade 1.4s ease-in-out infinite; }
  .skel-greet { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .skel-avatar { width: 40px; height: 40px; border-radius: 50%; }
  .skel-hero { height: 270px; border-radius: 26px; margin-bottom: 16px; }
  .skel-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .skel-row .skel { flex: 1; height: 48px; border-radius: 14px; }
  .skel-feed { height: 54px; border-radius: 16px; margin-bottom: 8px; }

  /* ---------- WEEKLY CHAMPION CELEBRATION ---------- */
  .champion-overlay {
    position: fixed; inset: 0; z-index: 500;
    background: radial-gradient(circle at 50% 18%, rgba(255,200,40,0.16), rgba(2,2,4,0.985) 55%);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .champion-overlay.show { opacity: 1; pointer-events: auto; }
  .champion-confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .champion-confetti-piece { position: absolute; top: -16px; border-radius: 2px; animation: confettiFallFull 2.4s ease-in forwards; }
  .champion-content { position: relative; text-align: center; padding: 24px; max-width: 360px; animation: championPop .55s cubic-bezier(.34,1.56,.64,1) both; }
  .champion-trophy { font-size: 88px; animation: floatY 2.4s ease-in-out infinite; filter: drop-shadow(0 0 24px rgba(255,200,40,.55)); }
  .champion-eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .12em; color: var(--gold); text-transform: uppercase; margin-top: 6px; }
  .champion-name { font-size: 26px; font-weight: 900; margin-top: 8px; }
  .champion-hp { font-size: 17px; font-weight: 800; color: var(--gold); margin-top: 4px; }
  .champion-sub { font-size: 13.5px; color: var(--muted); margin-top: 10px; }
  .champion-btn { margin-top: 22px; width: 100%; }
</style>
</head>
<body>

<div id="app">
  <div class="skel-screen">
    <div class="skel-loader">
      <div class="skel-loader-icon">🔥</div>
      <div class="skel-loader-text">Завантажуємо твій профіль...</div>
    </div>
    <div class="skel-greet">
      <div class="skel" style="height:30px;width:150px;border-radius:8px;"></div>
      <div class="skel skel-avatar"></div>
    </div>
    <div class="skel skel-hero"></div>
    <div class="skel-row">
      <div class="skel"></div>
      <div class="skel"></div>
      <div class="skel"></div>
    </div>
    <div class="skel skel-feed"></div>
    <div class="skel skel-feed"></div>
    <div class="skel skel-feed"></div>
  </div>
</div>

<div class="champion-overlay" id="championOverlay">
  <div class="champion-confetti" id="championConfetti"></div>
  <div class="champion-content">
    <div class="champion-trophy">🏆</div>
    <div class="champion-eyebrow">Чемпіон тижня</div>
    <div class="champion-name" id="championName">—</div>
    <div class="champion-hp" id="championHp">—</div>
    <div class="champion-sub">Топ-1 тижня — твій. Респект 🔥</div>
    <button class="btn btn-primary champion-btn" onclick="closeChampionCelebrate()">Дякую, погнали далі 🔥</button>
  </div>
</div>

<script>
  const API_BASE_URL = "https://worker-production-b767.up.railway.app";
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    // Апка має власну фіксовану темну тему (бренд-кольори), тож синхронізуємо
    // не кольори інтерфейсу з темою юзера, а хром Telegram (хедер/фон) з темою апки —
    // щоб не було білого "шву" зверху при відкритті.
    try { tg.setHeaderColor("#0a0c10"); } catch (e) {}
    try { tg.setBackgroundColor("#0a0c10"); } catch (e) {}
    try { tg.setBottomBarColor?.("#0a0c10"); } catch (e) {}
  }

  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth() + 1;

  let profileData = null;
  let achievements = [];
  let achPercent = 0;
  let ratingLoaded = false;
  let activeBadge = null;

  const MONTH_NAMES = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
  const WEEKDAY_NAMES = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
  const ACTION_META = {
    Gym: { cls: "gym", icon: "🏋️" },
    Street: { cls: "street", icon: "🦾" },
    Rest: { cls: "rest", icon: "🧘" },
    Skipped: { cls: "skip", icon: "🚫" },
    "Weekly Challenge": { cls: "challenge", icon: "🔥" },
  };

  function escapeHtml(value) {
    const div = document.createElement("div");
    div.innerText = value ?? "";
    return div.innerHTML;
  }

  function authHeaders() {
    return { Authorization: `tma ${tg.initData}` };
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }

  function haptic(type) {
    try {
      if (type === "selection") tg?.HapticFeedback?.selectionChanged?.();
      else tg?.HapticFeedback?.impactOccurred?.(type || "light");
    } catch (e) {}
  }

  document.addEventListener("click", (e) => {
    if (e.target.closest(".tab")) haptic("selection");
    else if (e.target.closest(".btn, .badge-card, .cal-nav button")) haptic("light");
  });

  // ==================== SKELETON ====================
  const SKELETON = `
    <div class="screen active" id="screen-today">
      <div class="greet">
        <div>
          <div class="greet-text">Привіт 👋</div>
          <div class="greet-name" id="greetName">Гравець</div>
        </div>
        <div class="avatar">🔥</div>
      </div>

      <div class="hero">
        <div class="ring-wrap">
          <svg viewBox="0 0 180 180">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff5a1f"/>
                <stop offset="100%" stop-color="#ffc828"/>
              </linearGradient>
            </defs>

  // ==================== TAB NAVIGATION ====================
  const TAB_ORDER = ["today", "calendar", "achievements", "rating"];
  let currentTabName = "today";

  function goTab(name) {
    const dir = TAB_ORDER.indexOf(name) >= TAB_ORDER.indexOf(currentTabName) ? "Right" : "Left";
    currentTabName = name;

    document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
    document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
    const screen = document.getElementById("screen-" + name);
    screen.classList.add("active");
    screen.style.animation = "none";
    void screen.offsetWidth;
    screen.style.animation = `screenIn${dir} .26s cubic-bezier(.34,1.1,.64,1) both`;
    document.querySelector(`.tab[data-tab="${name}"]`).classList.add("active");

    if (name === "today") animateRing();
    if (name === "calendar") animateCalendar();
    if (name === "achievements") animateAchievements();
    if (name === "rating") {
      if (ratingLoaded) animateRanks();
      else loadRating().then(animateRanks);
    }
  }

  // ==================== SWIPE BETWEEN TABS ====================
  (function setupSwipeNav() {
    let startX = 0, startY = 0, tracking = false;
    document.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 1) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      tracking = true;
    }, { passive: true });

    document.addEventListener("touchend", (e) => {
      if (!tracking) return;
      tracking = false;
      if (document.querySelector(".modal-backdrop.show") || document.getElementById("championOverlay")?.classList.contains("show")) return;
      const touch = e.changedTouches[0];
      const dx = touch.clientX - startX;
      const dy = touch.clientY - startY;
      if (Math.abs(dx) < 60 || Math.abs(dy) > 50) return;
      const idx = TAB_ORDER.indexOf(currentTabName);
      if (dx < 0 && idx < TAB_ORDER.length - 1) goTab(TAB_ORDER[idx + 1]);
      else if (dx > 0 && idx > 0) goTab(TAB_ORDER[idx - 1]);
    }, { passive: true });
  })();

  // ==================== TODAY ====================
  const RING_CIRC = 2 * Math.PI * 80;

  function animateRing() {
    if (!profileData) return;
    const max = profileData.streak_max || 14;
    const pct = max > 0 ? Math.min(1, profileData.streak / max) : 0;

    const fill = document.getElementById("ringFill");
    fill.style.transition = "none";
    fill.style.strokeDashoffset = RING_CIRC;
    void fill.offsetWidth;
    fill.style.transition = "stroke-dashoffset 1.2s cubic-bezier(.34,1.2,.4,1)";
    requestAnimationFrame(() => {
      fill.style.strokeDashoffset = RING_CIRC - RING_CIRC * pct;
    });
  }

  function wordTrainings(n) {
    const mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return "тренування";
    if (mod10 >= 2 && mod10 <= 4 && !(mod100 >= 12 && mod100 <= 14)) return "тренування";
    return "тренувань";
  }

  function heroMessages(streak, max) {
    if (streak <= 0) {
      return ["Стрік тижня ще не розпочато", "Зроби перше тренування — і він піде вгору 🔥"];
    }
    if (streak >= max) {
      return ["Максимальний стрік тижня! 🔥", `Ти зробив усі ${max} тренувань цього тижня — респект`];
    }
    const left = max - streak;
    return ["Стрік росте 🔥", `Ще ${left} ${wordTrainings(left)} — і заб'єш максимум (${max})`];
  }

  function pulseOnChange(el, newValue) {
    const prev = el.dataset.rawValue;
    el.dataset.rawValue = String(newValue);
    if (prev === undefined || Number(prev) === Number(newValue)) return;
    el.style.animation = "none";
    void el.offsetWidth;
    el.style.animation = "countPulse .5s ease";
  }

  function renderToday(data) {
    document.getElementById("greetName").textContent = data.nickname || "Гравець";
    document.getElementById("ringStreak").innerHTML = `${data.streak}<small>/${data.streak_max}</small>`;

    const [msg, sub] = heroMessages(data.streak, data.streak_max || 14);
    document.getElementById("heroMsg").textContent = msg;
    document.getElementById("heroSub").textContent = sub;

    const hpEl = document.getElementById("hpValue");

  // ==================== CALENDAR ====================
  function getKyivTodayKey() {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Kyiv", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  }

  function renderCalendar(year, month, days) {
    document.getElementById("calMonthLabel").textContent = `${MONTH_NAMES[month - 1]} ${year}`;

    const grid = document.getElementById("calGrid");
    grid.innerHTML = WEEKDAY_NAMES.map((w) => `<div class="cal-weekday">${w}</div>`).join("");

    const firstDay = new Date(year, month - 1, 1);
    const daysInMonth = new Date(year, month, 0).getDate();
    const leadingEmpty = (firstDay.getDay() + 6) % 7;
    const todayKey = getKyivTodayKey();

    for (let i = 0; i < leadingEmpty; i++) {
      grid.innerHTML += `<div class="cal-day empty"></div>`;
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dayKey = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const entries = days[dayKey] || [];
      const knownEntries = entries.filter((e) => ACTION_META[e.action_name]);
      const icons = knownEntries.map((e) => ACTION_META[e.action_name].icon).join("");
      const activityCls = knownEntries.length > 1 ? "multi" : (knownEntries[0] ? ACTION_META[knownEntries[0].action_name].cls : "");
      const cls = [activityCls, dayKey === todayKey ? "today" : ""].filter(Boolean).join(" ");
      grid.innerHTML += `<div class="cal-day ${cls}"><div class="num">${day}</div><div class="icon">${icons}</div></div>`;
    }

    animateCalendar();
  }

  function animateCalendar() {
    const cells = document.querySelectorAll("#calGrid .cal-day");
    let order = 0;
    cells.forEach((cell) => {
      const icon = cell.querySelector(".icon");
      if (icon && icon.textContent.trim()) {
        icon.style.animation = "none";
        void icon.offsetWidth;
        icon.style.animation = "flyIn .5s cubic-bezier(.34,1.56,.64,1) both";
        icon.style.animationDelay = (order * 0.05) + "s";
        order++;
      }
    });
  }

  function changeMonth(delta) {
    viewMonth += delta;
    if (viewMonth > 12) { viewMonth = 1; viewYear += 1; }
    if (viewMonth < 1) { viewMonth = 12; viewYear -= 1; }
    loadProfile();
  }

    document.querySelectorAll("#badgeGrid .badge-card").forEach((card) => {

      c.style.animationDelay = (i * 0.03) + "s";

  // ==================== RATING (lazy-loaded only when tab opens) ====================
  function rankAvatar(rank) {
    if (rank === 1) return "🥇";
    if (rank === 2) return "🥈";
    if (rank === 3) return "🥉";
    return "🔥";

  function rowHtml(r, isMe) {
    return `<div class="rank-row ${isMe ? "me" : ""}">
      <div class="rank-num">${r.rank}</div>
      <div class="rank-avatar">${rankAvatar(r.rank)}</div>
      <div class="rank-name">${escapeHtml(r.nick)}${isMe ? " (ти)" : ""}</div>
      <div class="rank-hp">${Number(r.hp).toLocaleString("uk")} HP</div>
    </div>`;
  }

  function renderRating(data) {
    const top = data.top || [];
    const me = data.me;
    const meInTop = !!me && top.some((r) => Number(r.telegram_user_id) === Number(me.telegram_user_id));

    let html = top.map((r) => rowHtml(r, !!me && Number(r.telegram_user_id) === Number(me.telegram_user_id))).join("");

    if (me && !meInTop) {
      html += `<div class="rank-divider">···</div>` + rowHtml(me, true);
    }

    if (!top.length && !me) {
      html = `<div class="state-msg">Рейтинг порожній. Стань першим 🚀</div>`;
    }

    document.getElementById("rankList").innerHTML = html;
  }

  function animateRanks() {
    document.querySelectorAll("#rankList .rank-row").forEach((row, i) => {
      row.style.animation = "none";
      void row.offsetWidth;
      row.style.animation = "slideIn .35s ease both";
      row.style.animationDelay = (i * 0.06) + "s";
    });
  }

  async function loadRating() {
    if (ratingLoaded) return;
    try {
      const response = await fetch(`${API_BASE_URL}/api/rating`, { headers: authHeaders() });
      if (!response.ok) throw new Error("bad status");
      const data = await response.json();
      ratingLoaded = true;

  // ==================== SHARE MODAL ====================
  function openModal(badge) {
    activeBadge = badge;
    document.getElementById("shareCanvasImg").src = renderShareCanvas(badge).toDataURL("image/png");
    document.getElementById("shareModal").classList.add("show");

  function renderShareCanvas(badge) {
    const canvas = document.createElement("canvas");
    canvas.width = 720;
    canvas.height = 720;
    const ctx = canvas.getContext("2d");

    const grad = ctx.createLinearGradient(0, 0, 720, 720);
    grad.addColorStop(0, "#2a1a0c");
    grad.addColorStop(1, "#120c08");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 720, 720);

    ctx.strokeStyle = "rgba(255,200,40,0.5)";
    ctx.lineWidth = 4;
    ctx.strokeRect(20, 20, 680, 680);

    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.font = "120px sans-serif";
    ctx.fillText(badge.icon, 360, 320);

    ctx.font = "bold 40px sans-serif";
    ctx.fillText(`«${badge.title}» розблоковано!`, 360, 420);

    ctx.font = "26px sans-serif";
    ctx.fillStyle = "#b9c0cc";
    ctx.fillText(`${profileData?.nickname || ""} · TurboTeam`, 360, 470);

    ctx.font = "bold 28px sans-serif";
    ctx.fillStyle = "#ffc828";
    ctx.fillText(`${badge.threshold} ${wordTrainings(badge.threshold)} пройдено 💪`, 360, 530);

    return canvas;
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand("copy");
    } finally {
      ta.remove();
    }
    return Promise.resolve();
  }

    if (!activeBadge || !tg?.initData) return;
    const badge = activeBadge;
    const imageDataUrl = document.getElementById("shareCanvasImg").src;

    showToast("Надсилаю картинку...");

    try {

        method: "POST",
        headers: { ...authHeaders(), "Content-Type": "application/json" },
        body: JSON.stringify({ title: badge.title, image: imageDataUrl }),
      });
      if (!response.ok) throw new Error("share failed");
      const data = await response.json();

      let pickerOpened = false;
      if (data.share_token && typeof tg.switchInlineQuery === "function") {
        try {
          tg.switchInlineQuery(data.share_token, ["users", "groups", "channels"]);
          pickerOpened = true;
        } catch (e) { pickerOpened = false; }

      showToast(
        pickerOpened
          ? "Обери, кому надіслати 👇"
          : "Готово! Картинку з посиланням надіслав тобі в чат з ботом — перешли її друзям 📤"
      );
    } catch (err) {
      const shareLink = profileData?.referral_link || profileData?.group_link || "";
      const shareText = shareLink

        .then(() => showToast("Не вдалося надіслати картинку. Текст скопійовано — встав у будь-який чат 📋"))
        .catch(() => showToast("Не вдалося надіслати. Спробуй ще раз 🙏"));
    }
  }

  // ==================== ACHIEVEMENT CELEBRATION ====================
  const SEEN_ACHIEVEMENTS_KEY = "tt_seen_achievements_v1";
  let celebrationQueue = [];
  let currentCelebrationBadge = null;

  function checkNewAchievements(list) {
    let seen = null;
    try { seen = JSON.parse(localStorage.getItem(SEEN_ACHIEVEMENTS_KEY)); } catch (e) { seen = null; }

    const unlockedCodes = (list || []).filter((b) => b.unlocked).map((b) => b.code);

    if (!Array.isArray(seen)) {
      localStorage.setItem(SEEN_ACHIEVEMENTS_KEY, JSON.stringify(unlockedCodes));
      return;
    }

    const newOnes = (list || []).filter((b) => b.unlocked && !seen.includes(b.code));
    localStorage.setItem(SEEN_ACHIEVEMENTS_KEY, JSON.stringify(unlockedCodes));

    if (newOnes.length) {
      celebrationQueue = newOnes.slice(1);
      celebrateAchievement(newOnes[0]);
    }
  }

    const container = document.getElementById("confettiContainer");
    container.innerHTML = "";
    const colors = ["#ff5a1f", "#ffc828", "#4cc9f0", "#34d399", "#f472b6"];
    for (let i = 0; i < 26; i++) {
      const piece = document.createElement("span");
      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "%";
      piece.style.background = colors[i % colors.length];
      piece.style.animationDelay = (Math.random() * 0.35) + "s";
      piece.style.transform = `rotate(${Math.random() * 360}deg)`;
      container.appendChild(piece);

    }
  }

  function celebrateChampion(info) {
    document.getElementById("championName").textContent = (info && info.nickname) || profileData?.nickname || "Ти";
    document.getElementById("championHp").textContent = `${Number((info && info.hp) || 0).toLocaleString("uk")} HP за тиждень`;
    spawnChampionConfetti();
    document.getElementById("championOverlay").classList.add("show");
    try { tg?.HapticFeedback?.notificationOccurred?.("success"); } catch (e) {}
  }

  function closeChampionCelebrate() {
    document.getElementById("championOverlay").classList.remove("show");
  }

  // ==================== PROFILE LOAD ====================
  function renderProfile(data) {
    profileData = data;
    renderToday(data);
    renderCalendar(data.calendar.year, data.calendar.month, data.calendar.days);
    renderAchievements(data.achievements);
    checkNewAchievements(data.achievements);
    animateRing();

    if (data.weekly_champion && !championCelebrationShown) {
      championCelebrationShown = true;
      setTimeout(() => celebrateChampion(data.weekly_champion), 450);
    }
  }

  async function loadProfile() {
    try {
      const response = await fetch(
        `${API_BASE_URL}/api/profile?year=${viewYear}&month=${viewMonth}`,
        { headers: authHeaders() }
      );

      if (!response.ok) {
        document.getElementById("app").innerHTML = `<div class="state-msg">⚠️ Не вдалося завантажити профіль (код ${response.status}).</div>`;
        return;
      }

      const data = await response.json();

      if (!profileData) {
        document.getElementById("app").innerHTML = SKELETON;
        document.getElementById("prevMonth").onclick = () => changeMonth(-1);
        document.getElementById("nextMonth").onclick = () => changeMonth(1);
        loadFeed();
      }

      renderProfile(data);
    } catch (e) {
      document.getElementById("app").innerHTML = `<div class="state-msg">⚠️ Помилка з'єднання з сервером.</div>`;
    }
  }

  if (!tg || !tg.initData) {
    document.getElementById("app").innerHTML = `<div class="state-msg">⚠️ Відкрий цю сторінку через кнопку в Telegram-боті.</div>`;
  } else {
    loadProfile();
  }
</script>
</body>
</html>
