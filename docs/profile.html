<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>КАЛЕНДАР ТРЕНУВАНЬ — TurboTeam</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0a0c10;
    --card: #161a22;
    --card-2: #1d2330;
    --text: #ffffff;
    --muted: #8b93a3;
    --accent: #ff5a1f;
    --border: rgba(255, 255, 255, 0.07);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 480px; margin: 0 auto; padding: 16px 16px 24px; }
  h1 { margin: 0 0 12px; font-size: 18px; }
  .calendar-status { margin: 12px 0; color: var(--muted); font-size: 14px; }
  .calendar-status:empty, #calendarSubscriptionStatus:empty { display: none; }
  .btn {
    flex: 1; border: none; border-radius: 14px; padding: 13px 10px;
    font-size: 13.5px; font-weight: 800; cursor: pointer;
    transition: transform .12s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #ff8a3d); color: #1a0a02; }
  .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }

  .cal-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 14px; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav button { background: var(--card-2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 5px 11px; font-size: 14px; cursor: pointer; }
  .cal-month-label { font-weight: 800; font-size: 14px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-weekday { text-align: center; color: var(--muted); font-size: 10px; padding-bottom: 4px; }
  .cal-day { position: relative; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 9px; background: var(--card-2); border: 1px solid var(--border); font-size: 10px; color: var(--muted); gap: 1px; }
  .cal-day.empty { background: transparent; border-color: transparent; }
  .cal-day .num { font-size: 10px; }
  .cal-day .icon { font-size: 12px; line-height: 1; letter-spacing: -1px; white-space: nowrap; }
  .cal-day.gym { background: rgba(255,90,31,.18); border-color: rgba(255,90,31,.4); color: var(--text); }
  .cal-day.street { background: rgba(76,201,240,.18); border-color: rgba(76,201,240,.4); color: var(--text); }
  .cal-day.rest { background: rgba(76,201,120,.18); border-color: rgba(76,201,120,.4); color: var(--text); }
  .cal-day.skip { background: rgba(220,60,60,.18); border-color: rgba(220,60,60,.4); color: var(--text); }
  .cal-day.challenge { background: rgba(255,200,40,.18); border-color: rgba(255,200,40,.4); color: var(--text); }
  .cal-day.multi { background: linear-gradient(135deg, rgba(255,200,40,.22), rgba(255,90,31,.22)); border-color: rgba(255,200,40,.6); color: var(--text); }
  .cal-day.today { border: 2px solid #fff; box-shadow: 0 0 7px 1px rgba(255,255,255,.65); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; font-size: 11px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 3px; }
  .cal-subscription, .cal-shortcut { margin-top: 12px; }
  .cal-shortcut .btn { width: 100%; min-height: 44px; }
  .cal-subscription .btn { width: 100%; }
  .cal-subscription [hidden] { display: none; }
  .cal-subscription p { font-size: 13px; margin: 8px 0; }
  .cal-subscription input { box-sizing: border-box; width: 100%; padding: 8px; margin-bottom: 8px; }
  .cal-stats { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .stats-summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stats-summary-tile { border-radius: 14px; padding: 10px 8px; text-align: center; border: 1px solid var(--border); }
  .stats-summary-tile.good { background: rgba(61,220,132,.12); border-color: rgba(61,220,132,.35); }
  .stats-summary-tile.bad { background: rgba(220,60,60,.12); border-color: rgba(220,60,60,.35); }
  .ss-icon { font-size: 15px; }
  .ss-value { font-size: 19px; font-weight: 800; margin-top: 2px; }
  .ss-label { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .stats-breakdown-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
  .sb-cell { background: var(--card-2); border: 1px solid var(--border); border-radius: 10px; padding: 7px 2px; text-align: center; }
  .sb-icon { font-size: 13px; }
  .sb-value { font-size: 12px; font-weight: 700; margin-top: 2px; color: var(--muted); }

  @keyframes flyIn { from { opacity:0; transform: translateY(-16px) scale(.3); } to { opacity:1; transform: none; } }
  .cal-nav button { min-width: 44px; min-height: 44px; }
  .cal-subscription input { font-size: 16px; }
</style>
</head>
<body>
<main>
  <h1>КАЛЕНДАР ТРЕНУВАНЬ</h1>
  <div class="cal-card">
    <div class="cal-nav">
      <button type="button" id="prevMonth" aria-label="Попередній місяць">←</button>
      <div class="cal-month-label" id="calMonthLabel">—</div>
      <button type="button" id="nextMonth" aria-label="Наступний місяць">→</button>
    </div>
    <p id="calendarStatus" class="calendar-status" role="status"></p>
    <button type="button" id="calendarRetry" class="btn btn-ghost" hidden>Спробувати ще раз</button>
    <div class="cal-grid" id="calGrid"></div>
    <div class="legend">
      <span>🏋️ Gym</span><span>🦾 Street</span><span>🧘 Rest</span><span>🚫 Skip</span><span>🔥 Challenge</span>
    </div>
    <div class="cal-stats" id="calStatsText" hidden></div>
    <div class="cal-shortcut">
      <button type="button" class="btn btn-primary" id="calendarShortcut" hidden>
        Додати на головний екран
      </button>
      <p id="calendarShortcutStatus" class="calendar-status" role="status"></p>
    </div>
    <div class="cal-subscription">
      <button type="button" class="btn btn-ghost" id="calendarSubscribe" onclick="loadCalendarSubscription()">
        Підписатися на календар iPhone
      </button>
      <div id="calendarSubscriptionDetails" hidden>
        <p>Відкрийте «Календар» → «Календарі» → «Додати календар» → «Додати підписний календар» і вставте посилання. Воно особисте.</p>
        <input id="calendarSubscriptionUrl" type="url" aria-label="Посилання на календар" readonly>
        <button type="button" class="btn btn-ghost" onclick="copyCalendarSubscription()">Скопіювати посилання</button>
      </div>
      <p id="calendarSubscriptionStatus" role="status"></p>
    </div>
  </div>
</main>
<script>
  const API_BASE_URL = "https://worker-production-b767.up.railway.app";
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    // Апка має власну фіксовану темну тему (бренд-кольори), тож синхронізуємо
    // не кольори інтерфейсу з темою юзера, а хром Telegram (хедер/фон) з темою апки —
    // щоб не було білого "шву" зверху при відкритті.
    try { tg.setHeaderColor("#0a0c10"); } catch (e) {}
    try { tg.setBackgroundColor("#0a0c10"); } catch (e) {}
    try { tg.setBottomBarColor?.("#0a0c10"); } catch (e) {}
  }

  const [currentYear, currentMonth] = getKyivTodayKey().split("-").map(Number);
  let viewYear = currentYear;
  let viewMonth = currentMonth;
  let calendarRequest;

  const MONTH_NAMES = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
  const WEEKDAY_NAMES = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
  const ACTION_META = {
    Gym: { cls: "gym", icon: "🏋️" },
    Street: { cls: "street", icon: "🦾" },
    Rest: { cls: "rest", icon: "🧘" },
    Skipped: { cls: "skip", icon: "🚫" },
    "Weekly Challenge": { cls: "challenge", icon: "🔥" },
  };

  function authHeaders() {
    return { Authorization: `tma ${tg.initData}` };
  }

  function track(eventName, meta) {
    if (!tg?.initData) return;
    fetch(`${API_BASE_URL}/api/track`, {
      method: "POST",
      headers: { ...authHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify({ event: eventName, meta: meta || {} }),
    }).catch(() => {});
  }

  function wordDays(n) {
    const mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return "день";
    if (mod10 >= 2 && mod10 <= 4 && !(mod100 >= 12 && mod100 <= 14)) return "дні";
    return "днів";
  }

  function getKyivTodayKey() {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Europe/Kyiv", year: "numeric", month: "2-digit", day: "2-digit"
    }).formatToParts(new Date());
    const date = Object.fromEntries(parts.map(({ type, value }) => [type, value]));
    return `${date.year}-${date.month}-${date.day}`;
  }

  function renderCalendar(year, month, days) {
    const grid = document.getElementById("calGrid");
    grid.innerHTML = WEEKDAY_NAMES.map((w) => `<div class="cal-weekday">${w}</div>`).join("");

    const firstDay = new Date(year, month - 1, 1);
    const daysInMonth = new Date(year, month, 0).getDate();
    const leadingEmpty = (firstDay.getDay() + 6) % 7;
    const todayKey = getKyivTodayKey();

    for (let i = 0; i < leadingEmpty; i++) {
      grid.innerHTML += `<div class="cal-day empty"></div>`;
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dayKey = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const entries = days[dayKey] || [];
      const knownEntries = entries.filter((e) => ACTION_META[e.action_name]);
      const icons = knownEntries.map((e) => ACTION_META[e.action_name].icon).join("");
      const activityCls = knownEntries.length > 1 ? "multi" : (knownEntries[0] ? ACTION_META[knownEntries[0].action_name].cls : "");
      const cls = [activityCls, dayKey === todayKey ? "today" : ""].filter(Boolean).join(" ");
      grid.innerHTML += `<div class="cal-day ${cls}"><div class="num">${day}</div><div class="icon">${icons}</div></div>`;
    }

    renderCalendarStats(year, month, days);
    animateCalendar();
  }

  function computeMonthStats(year, month, days) {
    const daysInMonth = new Date(year, month, 0).getDate();
    const todayKey = getKyivTodayKey();
    const [tYear, tMonth, tDay] = todayKey.split("-").map(Number);

    const isFutureMonth = year > tYear || (year === tYear && month > tMonth);
    const isCurrentMonth = year === tYear && month === tMonth;
    const lastDay = isFutureMonth ? 0 : (isCurrentMonth ? tDay : daysInMonth);

    const counts = { Gym: 0, Street: 0, Rest: 0, Skipped: 0, "Weekly Challenge": 0 };
    let trainedDays = 0;
    let missedDays = 0;

    for (let day = 1; day <= lastDay; day++) {
      const dayKey = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const entries = days[dayKey] || [];

      if (!entries.length) {
        missedDays++;
        continue;
      }

      let hasTraining = false;
      entries.forEach((e) => {
        if (counts.hasOwnProperty(e.action_name)) counts[e.action_name]++;
        if (e.action_name === "Gym" || e.action_name === "Street") hasTraining = true;
      });
      if (hasTraining) trainedDays++;
    }

    return { counts, trainedDays, missedDays };
  }

  function renderCalendarStats(year, month, days) {
    const { counts, trainedDays, missedDays } = computeMonthStats(year, month, days);
    const el = document.getElementById("calStatsText");

    el.innerHTML = `
      <div class="stats-summary-grid">
        <div class="stats-summary-tile good">
          <div class="ss-icon">✅</div>
          <div class="ss-value">${trainedDays}</div>
          <div class="ss-label">тренувався, ${wordDays(trainedDays)}</div>
        </div>
        <div class="stats-summary-tile bad">
          <div class="ss-icon">❌</div>
          <div class="ss-value">${missedDays}</div>
          <div class="ss-label">пропустив, ${wordDays(missedDays)}</div>
        </div>
      </div>
      <div class="stats-breakdown-grid">
        <div class="sb-cell"><div class="sb-icon">🦾</div><div class="sb-value">${counts.Street}</div></div>
        <div class="sb-cell"><div class="sb-icon">🏋️</div><div class="sb-value">${counts.Gym}</div></div>
        <div class="sb-cell"><div class="sb-icon">🧘</div><div class="sb-value">${counts.Rest}</div></div>
        <div class="sb-cell"><div class="sb-icon">🚫</div><div class="sb-value">${counts.Skipped}</div></div>
        <div class="sb-cell"><div class="sb-icon">🔥</div><div class="sb-value">${counts["Weekly Challenge"]}</div></div>
      </div>
    `;
  }

  function animateCalendar() {
    const cells = document.querySelectorAll("#calGrid .cal-day");
    let order = 0;
    cells.forEach((cell) => {
      const icon = cell.querySelector(".icon");
      if (icon && icon.textContent.trim()) {
        icon.style.animation = "none";
        void icon.offsetWidth;
        icon.style.animation = "flyIn .5s cubic-bezier(.34,1.56,.64,1) both";
        icon.style.animationDelay = (order * 0.05) + "s";
        order++;
      }
    });
  }

  function setupCalendarShortcut() {
    if (!tg.isVersionAtLeast?.("8.0") ||
        typeof tg.checkHomeScreenStatus !== "function" ||
        typeof tg.addToHomeScreen !== "function") return;

    const button = document.getElementById("calendarShortcut");
    const status = document.getElementById("calendarShortcutStatus");

    button.onclick = () => {
      status.textContent = "";
      try {
        tg.addToHomeScreen();
      } catch {
        status.textContent = "Не вдалося відкрити додавання ярлика. Спробуйте ще раз.";
      }
    };

    tg.onEvent("homeScreenAdded", () => {
      button.hidden = true;
      status.textContent = "Ярлик календаря додано.";
    });
    tg.checkHomeScreenStatus((state) => {
      button.hidden = state !== "missed" && state !== "unknown";
    });
  }

  async function loadCalendarSubscription() {
    const button = document.getElementById("calendarSubscribe");
    const status = document.getElementById("calendarSubscriptionStatus");
    if (!tg?.initData) {
      status.textContent = "Відкрийте TurboTeam у Telegram, щоб отримати посилання.";
      return;
    }

    button.disabled = true;
    status.textContent = "Отримуємо посилання…";
    try {
      const response = await fetch(`${API_BASE_URL}/api/training-calendar/subscription`, {
        method: "POST",
        headers: authHeaders()
      });
      if (response.status === 401) {
        status.textContent = "Відкрийте TurboTeam у Telegram ще раз.";
        return;
      }
      if (!response.ok) throw new Error("Calendar subscription request failed");
      const { path } = await response.json();
      document.getElementById("calendarSubscriptionUrl").value = `${API_BASE_URL}${path}`;
      document.getElementById("calendarSubscriptionDetails").hidden = false;
      button.hidden = true;
      status.textContent = "";
    } catch {
      status.textContent = "Не вдалося отримати посилання. Спробуйте ще раз.";
    } finally {
      button.disabled = false;
    }
  }

  async function copyCalendarSubscription() {
    const input = document.getElementById("calendarSubscriptionUrl");
    const status = document.getElementById("calendarSubscriptionStatus");
    try {
      await copyToClipboard(input.value);
      status.textContent = "Посилання скопійовано.";
    } catch {
      input.focus();
      input.select();
      status.textContent = "Скопіюйте виділене посилання вручну.";
    }
  }

  function changeMonth(delta) {
    viewMonth += delta;
    if (viewMonth > 12) { viewMonth = 1; viewYear += 1; }
    if (viewMonth < 1) { viewMonth = 12; viewYear -= 1; }
    loadCalendar();
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      if (!document.execCommand("copy")) return Promise.reject(new Error("Copy failed"));
    } finally {
      ta.remove();
    }
    return Promise.resolve();
  }

  async function loadCalendar() {
    calendarRequest?.abort();
    const request = new AbortController();
    calendarRequest = request;

    const year = viewYear;
    const month = viewMonth;
    const status = document.getElementById("calendarStatus");
    const retry = document.getElementById("calendarRetry");
    const stats = document.getElementById("calStatsText");

    document.getElementById("calMonthLabel").textContent = `${MONTH_NAMES[month - 1]} ${year}`;
    document.getElementById("calGrid").replaceChildren();
    stats.hidden = true;
    retry.hidden = true;
    status.textContent = "Завантажуємо календар…";

    try {
      const response = await fetch(`${API_BASE_URL}/api/training-calendar?year=${year}&month=${month}`, {
        headers: authHeaders(),
        signal: request.signal
      });
      if (request.signal.aborted) return;
      if (response.status === 401) {
        status.textContent = "Відкрийте TurboTeam у Telegram ще раз.";
        return;
      }
      if (!response.ok) throw new Error("Calendar request failed");

      const { days } = await response.json();
      if (request.signal.aborted) return;
      renderCalendar(year, month, days);
      stats.hidden = false;
      status.textContent = "";
    } catch {
      if (request.signal.aborted) return;
      status.textContent = "Не вдалося завантажити календар.";
      retry.hidden = false;
    }
  }

  if (tg?.initData) {
    document.getElementById("prevMonth").onclick = () => changeMonth(-1);
    document.getElementById("nextMonth").onclick = () => changeMonth(1);
    document.getElementById("calendarRetry").onclick = loadCalendar;
    track("app_open");
    loadCalendar();
    setupCalendarShortcut();
  } else {
    document.getElementById("calendarStatus").textContent = "Відкрийте календар через кнопку в Telegram-боті.";
    document.getElementById("prevMonth").disabled = true;
    document.getElementById("nextMonth").disabled = true;
  }
</script>
</body>
</html>
